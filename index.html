<!DOCTYPE html>
<html lang="id">
<head>
  <title>Login SITTA</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box {
      background: white;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      width: 320px;
      text-align: center;
    }
    .login-links {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
    }
    .login-links a {
      color: #004080;
      text-decoration: underline;
      font-size: 13px;
      cursor: pointer;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 6px;
      width: 300px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .close {
      cursor: pointer;
      font-size: 20px;
      font-weight: bold;
    }
    .close:hover {
      color: red;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2 style="margin-top: 0; margin-bottom: 20px;">Login SITTA</h2>

    <form id="formLogin">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required>
      </div>

      <button type="submit" style="width: 100%;">Login</button>
    </form>

    <div class="login-links">
      <a onclick="bukaModal('modalLupa')">Lupa Password</a>
      <a onclick="bukaModal('modalDaftar')">Daftar</a>
    </div>
  </div>

  <div id="modalLupa" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="margin: 0;">Lupa Password</h3>
        <span class="close" onclick="tutupModal('modalLupa')">&times;</span>
      </div>
      <form id="formLupa">
        <div class="form-group">
          <label>Email Terdaftar</label>
          <input type="email" id="lupaEmail" required>
        </div>
        <div style="text-align: right; margin-top: 15px;">
          <button type="button" onclick="tutupModal('modalLupa')">Batal</button>
          <button type="submit">Kirim</button>
        </div>
      </form>
    </div>
  </div>

  <div id="modalDaftar" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="margin: 0;">Daftar Pengguna</h3>
        <span class="close" onclick="tutupModal('modalDaftar')">&times;</span>
      </div>
      <form id="formDaftar">
        <div class="form-group">
          <label>Nama</label>
          <input type="text" id="regNama" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="regEmail" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPassword" required>
        </div>
        <div style="text-align: right; margin-top: 15px;">
          <button type="button" onclick="tutupModal('modalDaftar')">Batal</button>
          <button type="submit">Daftar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
